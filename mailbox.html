<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secret Santa Letter Generator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
  <section id="mailbox" class="mailbox">
      <h2>Mailbox</h2>
      <p>Here are your most recent letters!</p>
      <div class="letter-list"></div>
    </section>
  </main>

  <script>
  const letterListDiv = document.querySelector(".letter-list");
  const letters = JSON.parse(localStorage.getItem("letters")) || [];

  letters.forEach(letter => {
    const card = document.createElement("div");
    card.classList.add("letter-card", letter.theme);

    card.innerHTML = `
      <h3>To: ${letter.name}</h3>
      <p><strong>Email:</strong> ${letter.email}</p>
      <p>${letter.message}</p>
    `;

    letterListDiv.appendChild(card);
  });
  </script>

  <footer>
    <p>Made by @sunzcy</p>
  </footer>
</body>
</html>
