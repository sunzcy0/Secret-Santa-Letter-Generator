<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secret Santa Letter Generator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h3>Secret Santa Letter Generator</h3>
    <nav>
      <ul>
        <li><a href="./index.html">Home</a></li>
        <li><a href="./create-letter.html">Create a Letter</a></li>
      </ul>
    </nav>
  </header>
  <main>
  <section id="mailbox" class="mailbox">
      <h2>Mailbox</h2>
      <p>Here are your most recent letters!</p>
      <div class="letters-container" id="letters-container"></div>
    </section>
  </main>

  <script>
  const lettersContainer = document.getElementById("letters-container");
  const letters = JSON.parse(localStorage.getItem("letters")) || [];

  letters.forEach(letter => {
  const card = document.createElement("div");
  card.classList.add("letter-card");

  card.classList.add(`theme-${letter.theme}`);

  card.innerHTML = `
    <h2>Dear ${letter.name}</h2>
    <p>${letter.message}</p>
    <small>${letter.email}</small>
  `;

  lettersContainer.appendChild(card);
  });
  </script>

  <footer>
    <p>Made by @sunzcy</p>
  </footer>
</body>
</html>
